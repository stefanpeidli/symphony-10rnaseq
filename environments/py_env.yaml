name: py_env

channels:
  - conda-forge
  - bioconda

dependencies:
  - conda-forge::python=3.9
  - conda-forge::tqdm
  - numpy=1.26.4
  - pandas=2.2.3
  - conda-forge::scipy=1.12.0
  - conda-forge::seaborn=0.13.2
  - conda-forge::matplotlib
  - conda-forge::jupyter
  - conda-forge::ipykernel
  - conda-forge::nbconvert
  - conda-forge::mscorefonts
  - bioconda::gseapy=1.1.8
  - conda-forge::adjusttext 
  - pip
  - pip:
    - PyComplexHeatmap==1.6.6
    - matplotlib_venn
    - openpyxl